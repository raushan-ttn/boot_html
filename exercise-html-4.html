<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>3x3 Grid Layout HTML</title>
    <style>
      .container {
        display: grid;
        width: 600px;
        width: 600px;
        gap: 20px;
        background-color: #ddd;
        padding: 20px;
        grid-template-areas:
          "box1 box2 box3"
          "box4 box5 box6"
          "box7 box8 box9";
      }
      .grid-item {
        display: flex;
        padding: 20px;
        align-items: center;
        justify-content: center;
        font-weight: bold;
        font-size: 20px;
      }
      .grid-item-1 {
        grid-area: box1;
        background-color: red;
      }
      .grid-item-2 {
        grid-area: box2;
        background-color: yellow;
      }
      .grid-item-3 {
        grid-area: box3;
        background-color: red;
      }
      .grid-item-4 {
        grid-area: box4;
        background-color: yellow;
      }
      .grid-item-5 {
        grid-area: box5;
        background-color: red;
      }
      .grid-item-6 {
        grid-area: box6;
        background-color: yellow;
      }
      .grid-item-7 {
        grid-area: box7;
        background-color: red;
      }
      .grid-item-8 {
        grid-area: box8;
        background-color: yellow;
      }
      .grid-item-9 {
        grid-area: box9;
        background-color: red;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <div class="grid-item grid-item-1">Grid Item 1</div>
      <div class="grid-item grid-item-2">Grid Item 2</div>
      <div class="grid-item grid-item-3">Grid Item 3</div>
      <div class="grid-item grid-item-4">Grid Item 4</div>
      <div class="grid-item grid-item-5">Grid Item 5</div>
      <div class="grid-item grid-item-6">Grid Item 6</div>
      <div class="grid-item grid-item-7">Grid Item 7</div>
      <div class="grid-item grid-item-8">Grid Item 8</div>
      <div class="grid-item grid-item-9">Grid Item 9</div>
    </div>
  </body>
</html>
